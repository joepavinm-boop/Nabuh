<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Zainab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,800&family=Figtree:wght@400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#101412;font-family:Figtree,system-ui,sans-serif;-webkit-text-size-adjust:100%}

.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Two doors, side by side on wide screens, stacked on phones */
.doors{display:flex;flex-direction:column;min-height:100%;min-height:100svh}
.panel{
  flex:1 1 0;display:flex;flex-direction:column;justify-content:center;
  padding:clamp(2rem,6vw,4.5rem);
  padding-top:max(clamp(2rem,6vw,4.5rem),env(safe-area-inset-top,0px));
  padding-bottom:max(clamp(2rem,6vw,4.5rem),env(safe-area-inset-bottom,0px));
  text-decoration:none;position:relative;overflow:hidden;
  transition:flex-grow .5s ease;
}
.panel > *{max-width:26rem}
.panel h2{margin-bottom:1rem}
.panel p{margin-bottom:2rem;font-size:1.08rem;line-height:1.65}
.cta{
  align-self:flex-start;display:inline-flex;align-items:center;min-height:48px;
  padding:.8rem 1.6rem;border-radius:999px;font-weight:600;font-size:1rem;border:2px solid;
  transition:background-color .2s,color .2s;
}
.panel:focus-visible{outline:4px solid #b3261e;outline-offset:-8px}

/* Version 1: the letter. Same palette as demo1.html */
.letter{background:#fbfaf8;color:#1b1b1b}
.letter .flag{position:absolute;top:0;left:0;right:0;height:10px;
  background:linear-gradient(#111 0 30%,#fff 30% 36%,#b3261e 36% 64%,#fff 64% 70%,#0a5c3a 70%)}
.letter h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(2.4rem,7vw,4rem);line-height:1.05;letter-spacing:-.02em}
.letter p{color:#5b5b57}
.letter .cta{background:#0a5c3a;border-color:#0a5c3a;color:#fff}
.letter:hover .cta{background:transparent;color:#0a5c3a}
.letter:focus-visible .cta{background:transparent;color:#0a5c3a}

/* Version 2: the story. Same palette as demo2.html */
.story{background:#0f0e17;color:#f5f0eb}
.story::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 30% 20%,rgba(232,180,184,.14),transparent 60%)}
.story > *{position:relative}
.story h2{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:clamp(2.4rem,7vw,4rem);line-height:1.1;
  background:linear-gradient(135deg,#f5f0eb 0%,#f0c987 50%,#e8b4b8 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.story p{color:#a89f9a;font-family:Inter,system-ui,sans-serif;font-weight:300}
.story .cta{background:#f0c987;border-color:#f0c987;color:#0f0e17;font-family:Inter,system-ui,sans-serif}
.story:hover .cta{background:transparent;color:#f0c987}
.story:focus-visible .cta{background:transparent;color:#f0c987}

@media (min-width:800px){
  .doors{flex-direction:row}
  .panel:hover{flex-grow:1.25}
}
@media (prefers-reduced-motion:reduce){
  .panel,.cta{transition:none}
  .panel:hover{flex-grow:1}
}
</style>
</head>
<body>
<h1 class="visually-hidden">For Zainab</h1>
<main class="doors">

  <a class="panel letter" href="demo1.html" aria-label="Open version 1, the letter">
    <span class="flag" aria-hidden="true"></span>
    <h2>Zainab, you did it.</h2>
    <p>A short letter with an apology, a welcome to what comes next, and a celebration you get to pick.</p>
    <span class="cta">Open version 1</span>
  </a>

  <a class="panel story" href="demo2.html" aria-label="Open version 2, the story">
    <h2>I’m proud of you.</h2>
    <p>A slower page to scroll through. It starts with sorry, goes through congratulations, and ends with a welcome.</p>
    <span class="cta">Open version 2</span>
  </a>

</main>
</body>
</html>
